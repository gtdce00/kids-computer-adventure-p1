<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python นักสืบโค้ด (PRIMM)</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .mcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px;border-radius:22px;background:#fff;border:var(--b);box-shadow:4px 4px 0 var(--ink);font:inherit;color:var(--ink);cursor:pointer}
  .mcard:hover{transform:translateY(-3px)}
  .mcard .mi{font-size:46px;line-height:1}.mcard b{font-size:21px}.mcard small{font-size:15px;color:var(--ink2);line-height:1.4}
  .mcard .tag{background:var(--c-soft);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
  .mcard.all{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:var(--c-soft)}
  .two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:820px){.two{grid-template-columns:1fr}}
  .code{background:#1E2235;color:#E8ECF8;border-radius:16px;padding:12px 0;font:500 19px/1.55 Consolas,'Cascadia Mono','Courier New',monospace;overflow-x:auto;text-align:left;border:3px solid var(--ink)}
  .code .ln{display:flex;padding:0 14px 0 0;border-left:6px solid transparent;white-space:pre}
  .code .ln .no{width:42px;flex:none;text-align:right;padding-right:14px;color:#6E7799;user-select:none}
  .code.pick .ln{cursor:pointer}.code.pick .ln:hover{background:#2E3452}
  .code .ln.now{background:#3B4470;border-left-color:#FFD54F}
  .code .ln.hit{background:#1F5136;border-left-color:#4CE08A}
  .code .ln.miss{background:#5A2330;animation:shake .4s}
  .code .ln.glow{outline:3px solid #FFD54F;outline-offset:-3px}
  .code .ln.bug{background:#5A2330;border-left-color:#FF6B81}
  .k{color:#C792EA;font-weight:700}.f{color:#82AAFF}.s{color:#C3E88D}.n{color:#F78C6C}.c{color:#7F8AB0;font-style:italic}
  .blank{display:inline-block;min-width:3ch;padding:0 6px;border-radius:6px;background:#FFD54F;color:#1E2235;font-weight:700;text-align:center}
  .blank.ok{background:#4CE08A}
  .con{background:#0E1220;color:#7CF29C;border-radius:14px;padding:10px 14px;min-height:74px;font:500 18px/1.5 Consolas,'Courier New',monospace;white-space:pre-wrap;text-align:left;border:3px solid var(--ink)}
  .con.err{color:#FF8A9A}.con .hd{color:#8A93B5;font-size:13px;display:block;margin-bottom:2px}
  .vars{width:100%;border-collapse:collapse;font:500 17px Consolas,'Courier New',monospace;background:#fff;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
  .vars th{background:var(--c-soft);font:700 15px 'Mitr',sans-serif;padding:4px 8px;text-align:left}
  .vars td{padding:4px 10px;border-top:1px solid #E1E5F2}.vars td.ch{background:#FFF6C9;transition:background .6s}
  .lbl{font-weight:700;font-size:16px;margin:10px 0 4px;text-align:left}
  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
  .opt{background:#fff;border:var(--b);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:10px 14px;font:500 18px/1.45 Consolas,'Courier New',monospace;white-space:pre-wrap;text-align:left;color:var(--ink);cursor:pointer;min-height:60px}
  .opt.th{font-family:'Mitr',sans-serif}
  .opt.right{background:var(--ok-soft);border-color:var(--ok)}.opt.wrong{background:var(--no-soft);border-color:var(--no);opacity:.6}
  .opt.glow{outline:4px solid var(--sun);outline-offset:2px}
  .opt:disabled{cursor:default}
  .q{font-size:21px;text-align:left;margin:4px 0 10px}
  .stepbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .want{background:#E8FFF0;border:3px dashed var(--ok);border-radius:14px;padding:8px 14px;font:500 18px/1.5 Consolas,'Courier New',monospace;white-space:pre-wrap;text-align:left}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .chip{background:#fff;border:var(--b);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:8px 18px;font:700 22px Consolas,'Courier New',monospace;color:var(--ink);cursor:pointer}
  .chip.wrong{background:var(--no-soft);opacity:.55}.chip.right{background:var(--ok-soft)}.chip.glow{outline:4px solid var(--sun);outline-offset:2px}
  .primm{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
  .primm span{padding:3px 12px;border-radius:999px;background:#EEF1FA;font-size:14px;font-weight:700;color:#8790AE}
  .primm span.on{background:var(--c);color:#fff}
</style>
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
/* ม.2 วิทยาการคำนวณ · การเขียนโปรแกรมภาษา Python ตามขั้น PRIMM
   Predict (ทายผล) → Run (รันดูทีละบรรทัด) → Investigate (สืบโค้ด) → Modify (แก้โค้ด) + จับบั๊ก
   ข้อมูลข้างล่างสร้างจาก tools/build_m2python.py ซึ่งรันโค้ดทุกข้อด้วย Python จริง (ผลลัพธ์และ Error ตรงของจริง)
   ไม่ถามชื่อ ไม่เก็บข้อมูล ไม่โหลดอะไรจากอินเทอร์เน็ต ไม่มีเสียงพูด */
/*DATA*/const DATA = {"predict": [{"title": "print และตัวแปร", "code": "name = \"แมว\"\nprint(\"สวัสดี\", name)", "out": "สวัสดี แมว", "opts": ["สวัสดี แมว", "สวัสดี name", "สวัสดีแมว", "Error"], "why": "print ที่มีหลายค่าคั่นด้วย , จะเว้นวรรคให้ 1 ช่อง และ name ไม่มี \" \" จึงแสดงค่าในตัวแปร", "steps": [{"l": 0, "v": {"name": "'แมว'"}, "o": ""}, {"l": 1, "v": {"name": "'แมว'"}, "o": "สวัสดี แมว\n"}]}, {"title": "บวก คูณ", "code": "a = 7\nb = 2\nprint(a + b)\nprint(a * b)", "out": "9\n14", "opts": ["9\n14", "72\n14", "9\n72", "a + b\na * b"], "why": "a และ b เก็บตัวเลข จึงบวก/คูณกันได้ และ print 2 ครั้ง ได้ 2 บรรทัด", "steps": [{"l": 0, "v": {"a": "7"}, "o": ""}, {"l": 1, "v": {"a": "7", "b": "2"}, "o": ""}, {"l": 2, "v": {"a": "7", "b": "2"}, "o": "9\n"}, {"l": 3, "v": {"a": "7", "b": "2"}, "o": "9\n14\n"}]}, {"title": "เปลี่ยนค่าตัวแปร", "code": "x = 5\nx = x + 3\nprint(x)", "out": "8", "opts": ["8", "5", "53", "x + 3"], "why": "x = x + 3 คือ เอาค่าเดิมของ x (5) บวก 3 แล้วเก็บกลับเข้า x", "steps": [{"l": 0, "v": {"x": "5"}, "o": ""}, {"l": 1, "v": {"x": "8"}, "o": ""}, {"l": 2, "v": {"x": "8"}, "o": "8\n"}]}, {"title": "หารปัดเศษ และหารเอาเศษ", "code": "print(7 // 2, 7 % 2)", "out": "3 1", "opts": ["3 1", "3.5 0", "1 3", "3 0.5"], "why": "// หารแล้วเอาแต่จำนวนเต็ม (7 // 2 = 3) และ % ให้เศษ (7 % 2 = 1)", "steps": [{"l": 0, "v": {}, "o": "3 1\n"}]}, {"title": "ต่อข้อความ", "code": "s = \"Py\" + \"thon\"\nprint(s * 2)", "out": "PythonPython", "opts": ["PythonPython", "Python 2", "Python\nPython", "Error"], "why": "ข้อความ + ข้อความ = ต่อกัน และ ข้อความ * 2 = ซ้ำ 2 ครั้งติดกัน", "steps": [{"l": 0, "v": {"s": "'Python'"}, "o": ""}, {"l": 1, "v": {"s": "'Python'"}, "o": "PythonPython\n"}]}, {"title": "if / else", "code": "score = 65\nif score >= 50:\n    print(\"ผ่าน\")\nelse:\n    print(\"ไม่ผ่าน\")", "out": "ผ่าน", "opts": ["ผ่าน", "ไม่ผ่าน", "ผ่าน\nไม่ผ่าน", "(ไม่แสดงอะไร)"], "why": "65 >= 50 เป็นจริง (True) จึงทำเฉพาะส่วนของ if และข้ามส่วน else", "steps": [{"l": 0, "v": {"score": "65"}, "o": ""}, {"l": 1, "v": {"score": "65"}, "o": ""}, {"l": 2, "v": {"score": "65"}, "o": "ผ่าน\n"}]}, {"title": "if / elif / else", "code": "t = 30\nif t > 35:\n    print(\"ร้อนมาก\")\nelif t > 25:\n    print(\"อุ่น\")\nelse:\n    print(\"เย็น\")", "out": "อุ่น", "opts": ["อุ่น", "ร้อนมาก", "อุ่น\nเย็น", "เย็น"], "why": "ตรวจจากบนลงล่าง 30 > 35 เท็จ → ตรวจ elif 30 > 25 จริง → แสดง \"อุ่น\" แล้วหยุด ไม่ตรวจต่อ", "steps": [{"l": 0, "v": {"t": "30"}, "o": ""}, {"l": 1, "v": {"t": "30"}, "o": ""}, {"l": 3, "v": {"t": "30"}, "o": ""}, {"l": 4, "v": {"t": "30"}, "o": "อุ่น\n"}]}, {"title": "for กับ range", "code": "for i in range(3):\n    print(i)", "out": "0\n1\n2", "opts": ["0\n1\n2", "1\n2\n3", "0\n1\n2\n3", "3"], "why": "range(3) ให้ค่า 0, 1, 2 (เริ่มที่ 0 และไม่ถึง 3)", "steps": [{"l": 0, "v": {"i": "0"}, "o": ""}, {"l": 1, "v": {"i": "0"}, "o": "0\n"}, {"l": 0, "v": {"i": "1"}, "o": "0\n"}, {"l": 1, "v": {"i": "1"}, "o": "0\n1\n"}, {"l": 0, "v": {"i": "2"}, "o": "0\n1\n"}, {"l": 1, "v": {"i": "2"}, "o": "0\n1\n2\n"}, {"l": 0, "v": {"i": "2"}, "o": "0\n1\n2\n"}]}, {"title": "สะสมผลรวม", "code": "total = 0\nfor n in range(1, 4):\n    total = total + n\nprint(total)", "out": "6", "opts": ["6", "10", "3", "1\n3\n6"], "why": "range(1, 4) คือ 1, 2, 3 → total = 0+1+2+3 = 6 และ print อยู่นอกลูป จึงแสดงครั้งเดียว", "steps": [{"l": 0, "v": {"total": "0"}, "o": ""}, {"l": 1, "v": {"total": "0", "n": "1"}, "o": ""}, {"l": 2, "v": {"total": "1", "n": "1"}, "o": ""}, {"l": 1, "v": {"total": "1", "n": "2"}, "o": ""}, {"l": 2, "v": {"total": "3", "n": "2"}, "o": ""}, {"l": 1, "v": {"total": "3", "n": "3"}, "o": ""}, {"l": 2, "v": {"total": "6", "n": "3"}, "o": ""}, {"l": 1, "v": {"total": "6", "n": "3"}, "o": ""}, {"l": 3, "v": {"total": "6", "n": "3"}, "o": "6\n"}]}, {"title": "while นับถอยหลัง", "code": "n = 3\nwhile n > 0:\n    print(n)\n    n = n - 1\nprint(\"ปล่อยจรวด!\")", "out": "3\n2\n1\nปล่อยจรวด!", "opts": ["3\n2\n1\nปล่อยจรวด!", "3\n2\n1\n0\nปล่อยจรวด         $$('.opt', host).forEach((x, k) => { x.disabled = true; if (opts[k].ok) x.classList.add('right'); });
        if (!o.ok) { b.classList.add('wrong'); KIT.sfx.no(); } else KIT.sfx.ok();
        $('.runbox', host).hidden = false; $('.lbl', host).textContent = o.ok ? '✅ ทายถูก! กดรันเพื่อดูว่าทำไม' : '❌ ยังไม่ถูก กดรันดูทีละบรรทัดว่าเกิดอะไรขึ้น';
      }));
      let si = 0, timer = null, prevV = {};
      const show = () => {
        if (si >= it.steps.length || !host.isConnected) { clearInterval(timer); return; }
        const s = it.steps[si]; $$('.code .ln', host).forEach((l) => l.classList.toggle('now', Number(l.dataset.i) === s.l));
        $('.vars tbody', host).innerHTML = Object.entries(s.v).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="${prevV[k] !== v ? 'ch' : ''}">${esc(v)}</td></tr>`).join('') || '<tr><td colspan="2" style="color:#999">ยังไม่มีตัวแปร</td></tr>';
        prevV = s.v; $('.conhost', host).innerHTML = conHTML(s.o.replace(/\n$/, ''), false); KIT.sfx.step();
        si++; if (si >= it.steps.length) end();
      };
      const end = () => {
        clearInterval(timer); $('.stepbar', host).style.display = 'none';
        $$('.code .ln', host).forEach((l) => l.classList.remove('now'));
        const go = report(firstOk, it.title);
        fb(st, firstOk, firstOk ? 'ทายถูกตั้งแต่แรก!' : 'ผลจริงเป็นแบบนี้', it.why, more, go);
      };
      $('#bRun', host).onclick = () => { $('#bStep', host).disabled = true; $('#bRun', host).disabled = true; timer = setInterval(show, 650); show(); }; // รันต่อจากบรรทัดปัจจุบันได้
      $('#bStep', host).onclick = () => show();
    },

    // Investigate
    inv(host, it, report, st, more) {
      const mcq = it.t === 'mcq'; let wrong = 0, over = false;
      const opts = mcq ? shuffle(it.opts.map((t, k) => ({ t, ok: k === 0 }))) : [];
      host.innerHTML = `<p class="q">🔍 ${it.q}</p><div class="${mcq ? 'two' : ''}"><div>${codeHTML(it.code, mcq ? '' : 'pick')}</div>
        ${mcq ? `<div><div class="opts">${opts.map((o, k) => `<button class="opt th" data-k="${k}" style="font-size:26px;text-align:center">${esc(o.t)}</button>`).join('')}</div></div>` : '<p class="saytx mt-s">👆 แตะบรรทัดในโค้ด</p>'}</div>`;
      const win = () => { over = true; KIT.sfx.ok(); const go = report(wrong === 0, it.q.replace(/<[^>]+>/g, '')); fb(st, true, wrong === 0 ? 'ถูกต้อง! สืบเก่งมาก' : 'ถูกแล้ว', it.why, more, go); };
      if (mcq) $$('.opt', host).forEach((b) => (b.onclick = () => {
        if (over) return; const o = opts[Number(b.dataset.k)];
        if (o.ok) { b.classList.add('right'); $$('.opt', host).forEach((x) => (x.disabled = true)); win(); }
        else { wrong++; b.classList.add('wrong'); b.disabled = true; KIT.sfx.no(); glowAfter2(wrong, $$('.opt', host)[opts.findIndex((x) => x.ok)]); }
      }));
      else $$('.code .ln', host).forEach((l) => (l.onclick = () => {
        if (over) return; const i = Number(l.dataset.i);
        if (it.a.includes(i)) { l.classList.add('hit'); $('.code', host).classList.remove('pick'); win(); }
        else { wrong++; l.classList.remove('miss'); void l.offsetWidth; l.classList.add('miss'); KIT.sfx.no(); glowAfter2(wrong, $(`.ln[data-i="${it.a[0]}"]`, host)); }
      }));
    },

    // จับบั๊ก
    bug(host, it, report, st, more) {
      let wrong = 0, phase = 0; const lines = it.code.split('\n');
      const opts = shuffle(it.opts.map((t, k) => ({ t, ok: k === 0 })));
      const logic = !it.err;
      host.innerHTML = `<p class="q">🐞 โปรแกรมนี้มีบั๊ก! <b>แตะบรรทัดที่ผิด</b></p><div class="two"><div>${codeHTML(it.code, 'pick')}</div>
        <div>${logic ? `<p class="lbl">ผลที่ได้ (ผิด)</p>${conHTML(it.got || '(ไม่แสดงอะไร)', true, 'รันแล้วได้')}<p class="lbl">ผลที่ต้องการ</p><div class="want">${esc(it.want)}</div>`
          : `<p class="lbl">รันแล้วเกิด Error</p>${conHTML(it.err, true, 'Error')}`}
        <div class="fixbox" hidden><p class="lbl">เลือกวิธีแก้บรรทัด ${it.line + 1}</p><div class="opts" style="grid-template-columns:1fr">${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.t.trimStart() === o.t ? o.t : '␣␣␣␣' + o.t.trimStart())}</button>`).join('')}</div></div>
        <div class="okbox"></div></div></div>`;
      $$('.code .ln', host).forEach((l) => (l.onclick = () => {
        if (phase) return; const i = Number(l.dataset.i);
        if (i === it.line) { phase = 1; l.classList.add('bug'); $('.code', host).classList.remove('pick'); KIT.sfx.ok(); $('.fixbox', host).hidden = false; $('.q', host).innerHTML = '🐞 เจอแล้ว! <b>เลือกวิธีแก้</b>'; }
        else { wrong++; l.classList.remove('miss'); void l.offsetWidth; l.classList.add('miss'); KIT.sfx.no(); glowAfter2(wrong, $(`.ln[data-i="${it.line}"]`, host)); }
      }));
      $$('.fixbox .opt', host).forEach((b) => (b.onclick = () => {
        if (phase !== 1) return; const o = opts[Number(b.dataset.k)];
        if (o.ok) {
          phase = 2; b.classList.add('right'); $$('.fixbox .opt', host).forEach((x) => (x.disabled = true)); KIT.sfx.ok();
          const fixed = lines.map((x, j) => (j === it.line ? o.t : x)).join('\n');
          $('.code', host).outerHTML = codeHTML(fixed); $(`.code .ln[data-i="${it.line}"]`, host).classList.add('hit');
          $('.okbox', host).innerHTML = `<p class="lbl">รันใหม่หลังแก้ ✅</p>${conHTML(it.want, false)}`;
          const go = report(wrong === 0, (it.err ? it.err.split(':')[0] : 'บั๊กตรรกะ') + ' บรรทัด ' + (it.line + 1));
          fb(st, true, wrong === 0 ? 'แก้บั๊กได้ตั้งแต่ครั้งแรก!' : 'แก้บั๊กสำเร็จ', it.why, more, go);
        } else { wrong++; b.classList.add('wrong'); b.disabled = true; KIT.sfx.no(); glowAfter2(wrong, $$('.fixbox .opt', host)[opts.findIndex((x) => x.ok)]); }
      }));
    },

    // แก้โค้ด (เติมช่องว่าง)
    mod(host, it, report, st, more) {
      let wrong = 0, over = false; const chips = shuffle(it.opts.map((t, k) => ({ t, k })));
      host.innerHTML = `<p class="q">🛠️ เติมช่อง <span class="blank" style="font-family:Consolas,monospace">?</span> ให้โปรแกรมแสดงผลตามที่ต้องการ</p><div class="two"><div><div class="codehost">${codeHTML(it.code)}</div>
        <p class="lbl">เลือกคำไปเติม แล้วรันดู</p><div class="chips">${chips.map((c, j) => `<button class="chip" data-j="${j}">${esc(c.t)}</button>`).join('')}</div></div>
        <div><p class="lbl">ผลลัพธ์ที่ต้องการ 🎯</p><div class="want">${esc(it.want)}</div><p class="lbl">รันแล้วได้</p><div class="conhost">${conHTML('', false)}</div></div></div>`;
      $$('.chip', host).forEach((b) => (b.onclick = () => {
        if (over) return; const c = chips[Number(b.dataset.j)], out = it.res[c.k], ok = c.k === 0, err = /^\w+Error/.test(out);
        $('.codehost', host).innerHTML = codeHTML(it.code.replace('___', c.t));
        const ln = it.code.split('\n').findIndex((l) => l.includes('___')); $(`.code .ln[data-i="${ln}"]`, host).classList.add(ok ? 'hit' : 'bug');
        $('.conhost', host).innerHTML = conHTML(out, err || !ok, err ? 'Error' : 'รันแล้วได้');
        if (ok) { over = true; b.classList.add('right'); KIT.sfx.ok(); const go = report(wrong === 0, it.code.split('\n')[ln].trim().replace('___', c.t)); fb(st, true, wrong === 0 ? 'แก้ได้ตั้งแต่ครั้งแรก!' : 'ได้ผลตามต้องการแล้ว', it.why, more, go); }
        else { wrong++; b.classList.add('wrong'); b.disabled = true; KIT.sfx.no(); glowAfter2(wrong, $$('.chip', host)[chips.findIndex((x) => x.k === 0)]); }
      }));
    },
  };

  KIT.init({
    title: 'Python นักสืบโค้ด', grade: 'ม.2', subject: 'วิทยาการคำนวณ', topic: 'การเขียนโปรแกรมภาษา Python (PRIMM)',
    icon: '🐍🕵️', color: '#2E7D9A', soft: '#DDF1F7',
    pics: [['🔮', 'ทายผล'], ['▶️', 'รันดู'], ['🔍', 'สืบโค้ด'], ['🛠️', 'แก้โค้ด'], ['🐞', 'จับบั๊ก']],
    howto: ['Predict: อ่านโค้ดแล้วทายผลลัพธ์ก่อน จากนั้น Run ดูทีละบรรทัดว่าตัวแปรเปลี่ยนค่าอย่างไร', 'Investigate: แตะบรรทัดที่ทำหน้าที่ตามคำถาม หรือเลือกคำตอบ', 'Modify / จับบั๊ก: เลือกคำมาเติมหรือเลือกวิธีแก้ แล้วรันดูผลจริง', 'ตอบผิดลองใหม่ได้ ผิด 2 ครั้งจะมีกรอบสีเหลืองบอกใบ้'],
    start: (st) => menu(st),
  });
})();
</script>
</body>
