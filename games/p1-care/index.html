<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทำแบบนี้ถูกไหม</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>.ptile .pe{font-size:84px}</style>
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
/* ป.1 ว11201 สัปดาห์ที่ 4 การดูแลรักษาอุปกรณ์ · ป.2 ว12201 สัปดาห์ที่ 3 การดูแลรักษาอุปกรณ์ / มารยาท (ภาพสถานการณ์ ถูก ✓ / ผิด ✗) — ไม่เก็บข้อมูล ไม่มีเสียงพูด */
(function () {
  const S = [
    ['🧼🙌 ➜ 💻', 'ล้างมือให้สะอาดก่อนใช้คอมพิวเตอร์', true],
    ['🥤 ⌨️', 'วางแก้วน้ำไว้ข้างแป้นพิมพ์', false],
    ['🍔 🖥️', 'กินขนมหน้าคอมพิวเตอร์', false],
    ['🤲 🖱️', 'จับเมาส์เบา ๆ', true],
    ['👊 ⌨️', 'ทุบแป้นพิมพ์แรง ๆ', false],
    ['🧍🧍🧍 ⏳', 'ต่อแถวรอคิวใช้คอมพิวเตอร์', true],
    ['🏃💨 🖥️', 'วิ่งเล่นในห้องคอมพิวเตอร์', false],
    ['🔌⚡ ✋', 'เอานิ้วแหย่ปลั๊กไฟ', false],
    ['📴 ✅', 'ปิดเครื่องเมื่อใช้เสร็จ', true],
    ['🪑 🧹', 'เก็บเก้าอี้ให้เรียบร้อยก่อนออกจากห้อง', true],
    ['✋🖱️😠', 'แย่งเมาส์จากเพื่อน', false],
    ['🤝 🖱️', 'แบ่งกันใช้เมาส์กับเพื่อน', true],
  ];
  const rounds = S.map(([show, say, ok]) => ({ show, say, fixed: true, opts: [{ h: '✅', c: 'ทำได้ ถูกต้อง', ok }, { h: '❌', c: 'ไม่ควรทำ', ok: !ok }], explain: ok ? 'ทำแบบนี้ดีมาก ช่วยดูแลอุปกรณ์และห้องคอมพิวเตอร์' : 'ไม่ควรทำ เพราะอาจทำให้อุปกรณ์เสียหายหรือเกิดอันตราย', short: `${show} ${say} ${ok ? '✅' : '❌'}` }));
  KIT.init({
    title: 'ทำแบบนี้ถูกไหม', grade: 'ป.1–ป.2', subject: 'คอมพิวเตอร์', topic: 'การดูแลรักษาอุปกรณ์ / มารยาทในห้องคอมพิวเตอร์',
    icon: '✅❌', color: '#2FBF71', soft: '#DDF6E8',
    pics: [['🖼️', 'ดูภาพ'], ['✅', 'ถูก'], ['❌', 'ไม่ควรทำ']],
    howto: ['ดูภาพเหตุการณ์ในห้องคอมพิวเตอร์', 'ถ้าเป็นสิ่งที่ดี แตะ ✅ ถ้าไม่ควรทำ แตะ ❌', 'มี 10 ข้อ ครูช่วยอ่านคำบรรยายใต้ภาพได้'],
    start: (st) => KIT.pick(st, { rounds, count: 10, lesson: 'ข้อตกลงห้องคอมพิวเตอร์: ✅ ล้างมือก่อนใช้ · จับอุปกรณ์เบา ๆ · รอคิวและแบ่งปัน · ปิดเครื่องและเก็บของเมื่อใช้เสร็จ ❌ ไม่นำอาหาร-น้ำเข้าใกล้ · ไม่วิ่งเล่น · ไม่จับปลั๊กไฟ · ไม่แย่งเมาส์' }),
  });
})();
</script>
</body>
</html>
