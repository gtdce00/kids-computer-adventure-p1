<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลากเส้นต่อจุด</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .board{position:relative;width:100%;max-width:880px;margin:0 auto;aspect-ratio:8/5;border:var(--b);border-radius:20px;background:#fff;box-shadow:var(--pop);overflow:hidden;touch-action:none;cursor:crosshair}
  .board canvas{position:absolute;inset:0;width:100%;height:100%}
  .dt{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font:700 19px/1 'Mali';pointer-events:none;transition:background .2s}
  .dt.done{background:var(--ok);color:#fff;border-color:var(--ok)}
  .dt.next{background:var(--sun);animation:pop .9s infinite}
  .reveal{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:120px;opacity:0;transition:opacity .5s}
  .reveal.on{opacity:1}
  .hintline{display:flex;justify-content:center;gap:10px;align-items:center;font-size:40px;margin-bottom:10px}
</style>
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
/* ป.1–ป.2 ฝึกวาดภาพ: ลากเส้นต่อจุดตามลำดับตัวเลข — ไม่เก็บข้อมูล ไม่มีเสียงพูด */
(function () {
  const { $, $$ } = KIT;
  const W = 800, H = 500;
  const star = Array.from({ length: 10 }, (_, k) => { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 85 : 200; return [400 + r * Math.cos(a), 265 + r * Math.sin(a)]; });
  const heart = Array.from({ length: 12 }, (_, k) => { const t = Math.PI * 2 * k / 12; return [400 + 11 * 16 * Math.sin(t) ** 3, 230 - 11 * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]; });
  const PICS = [
    { name: 'บ้าน', emoji: '🏠', color: '#EF9A9A', pts: [[250, 420], [250, 240], [400, 110], [550, 240], [550, 420]] },
    { name: 'ดาว', emoji: '⭐', color: '#FFE082', pts: star },
    { name: 'ปลา', emoji: '🐟', color: '#81D4FA', pts: [[160, 250], [290, 150], [460, 160], [580, 230], [690, 150], [690, 350], [580, 270], [460, 340], [290, 350]] },
    { name: 'เรือใบ', emoji: '⛵', color: '#B3E5FC', pts: [[400, 70], [580, 300], [640, 300], [560, 420], [240, 420], [160, 300], [400, 300]] },
    { name: 'หัวใจ', emoji: '❤️', color: '#F8BBD0', pts: heart },
  ];
  let pi = 0;

  function play(st) {
    const P = PICS[pi]; let n = 1, dragging = false, cur = null;
    st.innerHTML = `<section class="card">${KIT.dots(PICS.length, pi)}
      <div class="hintline" aria-hidden="true">👆 <span style="font-size:28px">1</span> ➜ <span style="font-size:28px">2</span> ➜ <span style="font-size:28px">3</span> ➜ ❓</div>
      <p class="saytx">กดค้างที่เลข 1 แล้วลากไปเลข 2, 3, 4 … ตามลำดับ</p>
      <div class="board" id="bd"><canvas width="${W}" height="${H}"></canvas>${P.pts.map(([x, y], k) => `<span class="dt ${k === 0 ? 'next' : ''}" data-n="${k}" style="left:${x / 8}%;top:${y / 5}%">${k + 1}</span>`).join('')}<div class="reveal" id="rv">${P.emoji}</div></div>
      <div class="fbhost"></div></section>`;
    const bd = $('#bd'), cv = $('canvas', bd), cx = cv.getContext('2d');
    const pos = (e) => { const r = bd.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
    const redraw = () => {
      cx.clearRect(0, 0, W, H); cx.lineCap = 'round'; cx.lineJoin = 'round';
      cx.strokeStyle = '#1E88E5'; cx.lineWidth = 9; cx.beginPath();
      for (let k = 0; k < n; k++) { const [x, y] = P.pts[k]; k ? cx.lineTo(x, y) : cx.moveTo(x, y); }
      cx.stroke();
      if (dragging && cur) { cx.strokeStyle = 'rgba(30,136,229,.45)'; cx.setLineDash([6, 10]); cx.beginPath(); cx.moveTo(...P.pts[n - 1]); cx.lineTo(...cur); cx.stroke(); cx.setLineDash([]); }
    };
    const mark = () => $$('.dt', bd).forEach((d, k) => { d.classList.toggle('done', k < n); d.classList.toggle('next', k === n); });
    const finish = () => {
      dragging = false;
      cx.clearRect(0, 0, W, H); cx.fillStyle = P.color; cx.strokeStyle = '#1E88E5'; cx.lineWidth = 9; cx.lineJoin = 'round';
      cx.beginPath(); P.pts.forEach(([x, y], k) => (k ? cx.lineTo(x, y) : cx.moveTo(x, y))); cx.closePath(); cx.fill(); cx.stroke();
      $$('.dt', bd).forEach((d) => (d.style.opacity = '.25'));
      $('#rv').classList.add('on'); KIT.addScore(10); KIT.confetti();
      KIT.feedback($('.fbhost', st), true, 'ได้ภาพ ' + P.name + ' ' + P.emoji, 'ลากเส้นต่อจุดครบทุกจุดแล้ว เก่งมาก!', pi + 1 < PICS.length ? 'ภาพต่อไป →' : 'ดูผล →', () => { pi++; pi < PICS.length ? play(st) : KIT.end({ correct: PICS.length, total: PICS.length, label: 'ต่อจุดสำเร็จ', lesson: 'การลากเส้นต่อจุด ช่วยฝึกกดเมาส์ค้างแล้วลากให้ตรงตำแหน่ง ทำให้วาดภาพในคอมพิวเตอร์ได้คล่องขึ้น', review: PICS.map((p) => ({ ok: true, text: `${p.emoji} ${p.name}` })) }); });
    };
    bd.addEventListener('pointerdown', (e) => {
      e.preventDefault(); const [x, y] = pos(e), [lx, ly] = P.pts[n - 1];
      if (Math.hypot(x - lx, y - ly) < 40) { dragging = true; cur = [x, y]; if (bd.setPointerCapture) bd.setPointerCapture(e.pointerId); }
      else { const nx = $(`.dt[data-n="${n - 1}"]`, bd); nx.classList.add('next'); KIT.sfx.no(); }
    });
    bd.addEventListener('pointermove', (e) => {
      if (!dragging) return; cur = pos(e);
      const [tx, ty] = P.pts[n];
      if (Math.hypot(cur[0] - tx, cur[1] - ty) < 30) { n++; KIT.sfx.step(); mark(); if (n === P.pts.length) { cx.beginPath(); finish(); return; } }
      redraw();
    });
    const up = () => { dragging = false; cur = null; if (n < P.pts.length) redraw(); };
    bd.addEventListener('pointerup', up); bd.addEventListener('pointercancel', up);
    redraw(); mark();
  }

  KIT.init({
    title: 'ลากเส้นต่อจุด', grade: 'ป.1–ป.2', subject: 'คอมพิวเตอร์', topic: 'ฝึกวาดภาพ (ลากเส้น)',
    icon: '✏️1️⃣2️⃣3️⃣', color: '#1E88E5', soft: '#DCEBFF',
    pics: [['👆', 'กดค้างที่ 1'], ['〰️', 'ลากไป 2, 3, 4'], ['🏠', 'ได้ภาพ!']],
    howto: ['กดเมาส์ค้างที่เลข 1 (จุดสีเหลือง)', 'ลากไปหาเลขถัดไปตามลำดับ ปล่อยแล้วเริ่มต่อจากจุดล่าสุดได้', 'ต่อครบทุกจุดจะได้ภาพ 5 ภาพ'],
    start: (st) => { pi = 0; play(st); },
  });
})();
</script>
</body>
</html>
