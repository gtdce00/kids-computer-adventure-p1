<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ไฟจราจรความปลอดภัย</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>.ptile .pe{font-size:76px}</style>
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
/* ป.1 ว11201 สัปดาห์ที่ 13–15 · ป.2 ว12201 สัปดาห์ที่ 16 ใช้เทคโนโลยีอย่างปลอดภัย
   (ไฟจราจร: เขียว = ใช้ได้, เหลือง = ถามครู, แดง = หยุด · ข้อมูลส่วนตัว "ไม่บอก แล้วไปบอกครู") — ไม่เก็บข้อมูล ไม่มีเสียงพูด */
(function () {
  const L = { g: { h: '🟢', c: 'ใช้ได้' }, y: { h: '🟡', c: 'ถามครูก่อน' }, r: { h: '🔴', c: 'หยุด!' } };
  const S = [
    ['🖍️🖥️', 'วาดภาพในโปรแกรมวาดภาพที่ครูเปิดให้', 'g', 'ใช้ได้ เป็นกิจกรรมที่ครูให้ทำ'],
    ['📺🐻', 'ดูการ์ตูนความรู้ที่ครูเปิดให้', 'g', 'ใช้ได้ เพราะครูเลือกให้แล้ว'],
    ['🪑🙂🖥️', 'นั่งหลังตรง อยู่ห่างจอพอดี', 'g', 'ท่านั่งที่ถูกต้อง ดีต่อสายตาและหลัง'],
    ['⚠️🎁❗', 'มีหน้าต่างเด้งขึ้นมา บอกว่าได้รางวัล ให้กด', 'r', 'หยุด! ไม่กดหน้าต่างแปลก ๆ แล้วบอกครู'],
    ['🧑‍🦱💬🏠', 'คนแปลกหน้าในเกมถามชื่อและที่อยู่บ้าน', 'r', 'หยุด! ไม่บอกข้อมูลส่วนตัว แล้วไปบอกครู'],
    ['😵🎮⏰', 'เล่นเกมนานจนตาล้า', 'r', 'หยุดพัก ละสายตาจากจอ มองไกล ๆ'],
    ['📥🎮', 'อยากดาวน์โหลดเกมใหม่', 'y', 'ถามครูหรือผู้ปกครองก่อนดาวน์โหลดทุกครั้ง'],
    ['🔗❓', 'เพื่อนส่งลิงก์แปลก ๆ มาให้กด', 'y', 'ถามครูก่อน ไม่กดลิงก์ที่ไม่รู้จัก'],
    ['📷🤳', 'อยากโพสต์รูปตัวเองลงอินเทอร์เน็ต', 'y', 'ถามครูหรือผู้ปกครองก่อนโพสต์รูป'],
    ['💬😡', 'มีคนพิมพ์คำไม่สุภาพใส่เรา', 'r', 'หยุด! ไม่ตอบโต้ แล้วไปบอกครู'],
    ['🔍🐘', 'ค้นภาพช้างจากลิงก์ที่ครูเตรียมไว้', 'g', 'ใช้ได้ เป็นลิงก์ที่ครูเตรียมให้'],
    ['🔑❓🧒', 'เพื่อนขอรหัสผ่านของเรา', 'r', 'หยุด! รหัสผ่านเป็นความลับ ไม่บอกใคร'],
  ];
  const rounds = S.map(([show, say, a, why]) => ({ show, say, fixed: true, opts: ['g', 'y', 'r'].map((k) => ({ h: L[k].h, c: L[k].c, ok: k === a })), explain: why, short: `${show} ${L[a].h} ${L[a].c}` }));
  KIT.init({
    title: 'ไฟจราจรความปลอดภัย', grade: 'ป.1–ป.2', subject: 'คอมพิวเตอร์', topic: 'ใช้เทคโนโลยีอย่างปลอดภัย',
    icon: '🟢🟡🔴', color: '#E53935', soft: '#FFE3E3',
    pics: [['🟢', 'ใช้ได้'], ['🟡', 'ถามครู'], ['🔴', 'หยุด!']],
    howto: ['ดูภาพเหตุการณ์ (ครูช่วยอ่านคำบรรยายได้)', 'แตะไฟ 🟢 ใช้ได้ · 🟡 ถามครูก่อน · 🔴 หยุด!', 'มี 10 ข้อ ถ้ามีใครถามชื่อหรือบ้าน: ไม่บอก แล้วไปบอกครู'],
    start: (st) => KIT.pick(st, { rounds, count: 10, lesson: '🟢 <b>ใช้ได้</b> เมื่อเป็นสิ่งที่ครูให้ทำ · 🟡 <b>ถามครูก่อน</b> เมื่อจะดาวน์โหลด กดลิงก์ หรือโพสต์รูป · 🔴 <b>หยุด!</b> เมื่อเจอหน้าต่างแปลก คนแปลกหน้าถามข้อมูลส่วนตัว หรือคำไม่สุภาพ — <b>ไม่บอก แล้วไปบอกครู</b>' }),
  });
})();
</script>
</body>
</html>
