<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>อุปกรณ์ดิจิทัลรอบตัว</title>
<link rel="stylesheet" href="../kit/kit.css">
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
/* ป.2 คอมพิวเตอร์ ว12201 · สัปดาห์ที่ 4 อุปกรณ์ดิจิทัลรอบตัว — ไม่เก็บข้อมูลผู้เล่น */
(function () {
  const { shuffle } = KIT;
  const DIGITAL = [
    ['📺', 'โทรทัศน์', 'มีหน้าจอ ใช้ไฟฟ้า แสดงภาพและเสียงได้'],
    ['📱', 'โทรศัพท์มือถือ', 'ใช้โทร ถ่ายรูป ดูวิดีโอ เป็นอุปกรณ์ดิจิทัล'],
    ['💻', 'คอมพิวเตอร์โน้ตบุ๊ก', 'ประมวลผลข้อมูลได้ เป็นอุปกรณ์ดิจิทัล'],
    ['⌚', 'นาฬิกาอัจฉริยะ', 'มีหน้าจอ นับก้าวและบอกเวลาได้ เป็นอุปกรณ์ดิจิทัล'],
    ['📷', 'กล้องถ่ายรูปดิจิทัล', 'เก็บรูปเป็นไฟล์ในเครื่อง เป็นอุปกรณ์ดิจิทัล'],
    ['🎮', 'เครื่องเล่นเกม', 'ใช้ไฟฟ้าและมีโปรแกรมเกม เป็นอุปกรณ์ดิจิทัล'],
    ['🖨️', 'เครื่องพิมพ์', 'รับข้อมูลจากคอมพิวเตอร์แล้วพิมพ์ออกมา'],
    ['📟', 'เครื่องคิดเลข', 'กดตัวเลขแล้วคำนวณให้ เป็นอุปกรณ์ดิจิทัล'],
  ];
  const NOT = [
    ['🥄', 'ช้อน', 'ไม่ใช้ไฟฟ้า ไม่มีหน้าจอ ไม่ใช่อุปกรณ์ดิจิทัล'],
    ['🧹', 'ไม้กวาด', 'ใช้มือกวาด ไม่มีระบบดิจิทัล'],
    ['🪑', 'เก้าอี้', 'ใช้นั่ง ไม่ใช่อุปกรณ์ดิจิทัล'],
    ['📕', 'หนังสือ', 'เป็นกระดาษ ไม่ใช้ไฟฟ้า'],
    ['⚽', 'ลูกบอล', 'เป็นของเล่น ไม่มีระบบดิจิทัล'],
    ['🪥', 'แปรงสีฟัน', 'ใช้แปรงฟัน ไม่ใช้ไฟฟ้า'],
    ['✂️', 'กรรไกร', 'ใช้ตัด ไม่ใช่อุปกรณ์ดิจิทัล'],
    ['🧺', 'ตะกร้า', 'ใช้ใส่ของ ไม่ใช่อุปกรณ์ดิจิทัล'],
  ];
  let correct = 0, total = 0, review = [];
  const BINS = [{ id: 'd', label: 'อุปกรณ์ดิจิทัล', icon: '⚡', color: '#5B8CFF' }, { id: 'n', label: 'ไม่ใช่อุปกรณ์ดิจิทัล', icon: '🏠', color: '#FF9F45' }];
  const pick = (n1, n2) => shuffle(DIGITAL).slice(0, n1).map(([icon, name, why]) => ({ icon, name, why, bin: 'd' }))
    .concat(shuffle(NOT).slice(0, n2).map(([icon, name, why]) => ({ icon, name, why, bin: 'n' })));
  const hint = (it) => it.bin === 'd' ? 'ลองคิดดู ' + it.name + ' ใช้ไฟฟ้า มีหน้าจอหรือปุ่มกด และทำงานด้วยข้อมูลไหม?' : 'ลองคิดดู ' + it.name + ' ใช้ไฟฟ้าหรือเก็บข้อมูลได้ไหม?';

  function round(st, n) {
    KIT.sortGame(st, {
      tag: `รอบ ${n} / 2`,
      prompt: n === 1 ? 'ของในบ้านชิ้นไหนเป็น <b>อุปกรณ์ดิจิทัล</b>? ลากไปใส่กล่องให้ถูก' : 'รอบ 2 ของเยอะขึ้น แยกให้ถูกนะ',
      items: n === 1 ? pick(3, 3) : pick(4, 4), bins: BINS, hint,
      onDone: (c, t, r) => { correct += c; total += t; review = review.concat(r);
        if (n === 1) round(st, 2);
        else KIT.end({ correct, total, label: 'แยกถูกครั้งแรก', review, lesson: '<b>อุปกรณ์ดิจิทัล</b> คือเครื่องใช้ที่ทำงานด้วยไฟฟ้าและข้อมูล มักมีหน้าจอหรือปุ่มกด เช่น โทรทัศน์ โทรศัพท์มือถือ คอมพิวเตอร์ ส่วนช้อน ไม้กวาด หนังสือ ไม่ใช่อุปกรณ์ดิจิทัล' }); },
    });
  }

  KIT.init({
    title: 'อุปกรณ์ดิจิทัลรอบตัว', grade: 'ป.2', subject: 'คอมพิวเตอร์ ว12201', topic: 'อุปกรณ์ดิจิทัลรอบตัว',
    icon: '📺📱🥄', color: '#5B8CFF', soft: '#DFE8FF', speak: true,
    howto: ['ดูของใช้ในบ้านทีละชิ้น', 'ลากไปใส่กล่อง อุปกรณ์ดิจิทัล หรือ ไม่ใช่อุปกรณ์ดิจิทัล (หรือแตะของ แล้วแตะกล่อง)', 'เล่น 2 รอบ ยิ่งแยกถูกครั้งแรก ยิ่งได้ดาวเยอะ'],
    start: (st) => { correct = 0; total = 0; review = []; round(st, 1); },
  });
})();
</script>
</body>
</html>
