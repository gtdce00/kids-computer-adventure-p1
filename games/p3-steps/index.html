<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เรียงลำดับขั้นตอน</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
  @media (max-width:720px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .slot{min-height:150px;border:3px dashed var(--c);border-radius:18px;background:var(--c-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;position:relative}
  .slot .no{position:absolute;top:6px;left:8px;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 16px/1 'Mali'}
  .slot.filled{border-style:solid;background:#fff;cursor:pointer}
  .slot.good{border-color:var(--ok);background:var(--ok-soft)}
  .slot.bad{border-color:var(--no);background:var(--no-soft);animation:shake .4s}
  .slot .em,.step .em{font-size:44px;line-height:1.1}
  .slot .tx,.step .tx{font-size:16px;line-height:1.3;margin-top:4px}
  .pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:120px}
  .step{width:170px;padding:10px;border-radius:18px;background:#fff;border:var(--b);box-shadow:3px 3px 0 var(--ink);text-align:center}
  .step:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
/* ป.3 คอมพิวเตอร์ ว13201 · สัปดาห์ที่ 2–3 การเรียงลำดับขั้นตอน / อัลกอริทึมอย่างง่าย — ไม่เก็บข้อมูลผู้เล่น */
(function () {
  const { $, $$, shuffle, esc } = KIT;
  const TASKS = [
    { name: 'แปรงฟัน', icon: '🪥', steps: [['🪥', 'บีบยาสีฟันใส่แปรง'], ['😁', 'แปรงฟันให้ทั่วทุกซี่'], ['💧', 'บ้วนปากด้วยน้ำสะอาด'], ['🧼', 'ล้างแปรง เก็บเข้าที่']] },
    { name: 'ล้างมือ', icon: '🧼', steps: [['🚰', 'เปิดน้ำ ทำให้มือเปียก'], ['🧼', 'ถูสบู่ให้ทั่วมือ'], ['💦', 'ล้างฟองสบู่ออก'], ['🧻', 'เช็ดมือให้แห้ง']] },
    { name: 'ปลูกต้นไม้', icon: '🌱', steps: [['⛏️', 'ขุดหลุม'], ['🌱', 'วางต้นกล้าลงหลุม'], ['🟫', 'กลบดินให้แน่น'], ['💧', 'รดน้ำ']] },
    { name: 'ข้ามถนน', icon: '🚸', steps: [['🛑', 'หยุดรอที่ทางม้าลาย'], ['👀', 'มองขวา ซ้าย และขวาอีกครั้ง'], ['✋', 'ยกมือให้รถเห็น'], ['🚶', 'เดินข้ามอย่างระมัดระวัง']] },
    { name: 'เปิดใช้คอมพิวเตอร์', icon: '🖥️', steps: [['🔌', 'ตรวจว่าเสียบปลั๊กแล้ว'], ['🔘', 'กดปุ่มเปิดเครื่อง'], ['⏳', 'รอจนเครื่องพร้อมใช้'], ['🖱️', 'คลิกเปิดโปรแกรมที่ต้องการ']] },
    { name: 'ชงนมผง', icon: '🥛', steps: [['🧴', 'ล้างแก้วให้สะอาด'], ['🥄', 'ตักนมผงใส่แก้ว'], ['🫖', 'เทน้ำอุ่นลงในแก้ว'], ['🌀', 'คนให้นมละลาย']] },
  ];
  let order = [], ti = 0, results = [];

  function task(st) {
    const T = order[ti]; let slots = [null, null, null, null], tries = 0;
    const pool = shuffle(T.steps.map((_, k) => k));
    st.innerHTML = `<section class="card">
      ${KIT.dots(order.length, ti, results)}<p class="qtag">เรื่องที่ ${ti + 1} / ${order.length}</p>
      <div class="prompt">${T.icon} เรียงขั้นตอน <b>"${esc(T.name)}"</b> ให้ถูกลำดับ</div>
      <div class="slots" id="slots"></div>
      <div class="pool" id="pool"></div>
      <div class="row mt"><button class="btn ok" id="check" disabled>✓ ตรวจคำตอบ</button></div>
      <div class="fbhost"></div></section>`;
    KIT.say('เรียงขั้นตอน ' + T.name + ' ให้ถูกลำดับ');
    const draw = () => {
      $('#slots').innerHTML = slots.map((s, k) => `<div class="slot ${s !== null ? 'filled' : ''}" data-drop="${k}" data-s="${k}"><span class="no">${k + 1}</span>${s !== null ? `<span class="em">${T.steps[s][0]}</span><span class="tx">${esc(T.steps[s][1])}</span>` : '<span class="tx" style="color:var(--ink2)">ขั้นที่ ' + (k + 1) + '</span>'}</div>`).join('');
      const left = pool.filter((p) => !slots.includes(p));
      $('#pool').innerHTML = left.map((p) => `<div class="step" data-p="${p}" role="button" tabindex="0"><span class="em">${T.steps[p][0]}</span><div class="tx">${esc(T.steps[p][1])}</div></div>`).join('') || '<p style="color:var(--ink2)">วางครบแล้ว กดตรวจคำตอบได้เลย</p>';
      $('#check').disabled = slots.includes(null);
      $$('.step', st).forEach((el) => KIT.draggable(el, (t) => put(Number(el.dataset.p), Number(t.dataset.drop)), () => put(Number(el.dataset.p))));
      $$('.slot.filled', st).forEach((el) => (el.onclick = () => { slots[Number(el.dataset.s)] = null; KIT.sfx.tap(); draw(); }));
    };
    const put = (p, at) => {
      $('.fbhost', st).innerHTML = '';
      if (at === undefined || slots[at] !== null) at = slots.indexOf(null);
      if (at < 0) return;
      slots[at] = p; KIT.sfx.tap(); draw();
    };
    draw();
    $('#check').onclick = () => {
      tries++;
      const wrong = slots.map((s, k) => s !== k);
      $$('.slot', st).forEach((el, k) => el.classList.add(wrong[k] ? 'bad' : 'good'));
      if (!wrong.includes(true)) {
        results[ti] = tries === 1; KIT.addScore(tries === 1 ? 20 : 10);
        $('#check').disabled = true;
        KIT.feedback($('.fbhost', st), true, 'เรียงถูกต้อง!', 'ทำตามลำดับนี้ งานจึงสำเร็จ', ti + 1 < order.length ? 'เรื่องต่อไป →' : 'ดูผล →', () => { ti++; ti < order.length ? task(st) : finish(); });
      } else {
        const n = wrong.filter(Boolean).length;
        KIT.feedback($('.fbhost', st), false, `ยังมี ${n} ขั้นที่วางผิดที่`, 'ช่องสีแดงคือขั้นที่ยังไม่ถูก แตะช่องนั้นเพื่อเอาออก แล้ววางใหม่ คิดว่าต้องทำอะไรก่อน-หลัง');
        setTimeout(() => { slots = slots.map((s, k) => (wrong[k] ? null : s)); draw(); }, 1100);
      }
    };
  }

  function finish() {
    const correct = results.filter(Boolean).length;
    KIT.end({ correct, total: order.length, label: 'เรียงถูกครั้งแรก', review: order.map((t, k) => ({ ok: results[k], text: `${t.icon} ${t.name}` })),
      lesson: '<b>อัลกอริทึม</b> คือ ขั้นตอนการทำงานที่เรียงลำดับไว้อย่างชัดเจน การทำงานทุกอย่างต้องทำตามลำดับ ถ้าสลับขั้นตอน งานอาจไม่สำเร็จ เช่น ต้องขุดหลุมก่อนวางต้นกล้า' });
  }

  KIT.init({
    title: 'เรียงลำดับขั้นตอน', grade: 'ป.3', subject: 'คอมพิวเตอร์ ว13201', topic: 'การเรียงลำดับขั้นตอน / อัลกอริทึมอย่างง่าย',
    icon: '1️⃣2️⃣3️⃣', color: '#FF9F45', soft: '#FFE9D3',
    howto: ['ดูบัตรขั้นตอนของแต่ละเรื่อง', 'ลากบัตรไปวางในช่องขั้นที่ 1–4 (หรือแตะบัตรเพื่อวางช่องถัดไป) แตะช่องเพื่อเอาออก', 'กดตรวจคำตอบ ทั้งหมด 5 เรื่อง'],
    start: (st) => { order = shuffle(TASKS).slice(0, 5); ti = 0; results = []; task(st); },
  });
})();
</script>
</body>
</html>
