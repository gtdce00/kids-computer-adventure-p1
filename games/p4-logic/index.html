<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ไขปริศนาด้วยเหตุผล</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .seq{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:40px;padding:8px 14px;background:var(--c-soft);border-radius:16px;margin-top:8px}
  .seq .q{width:52px;height:52px;border:3px dashed var(--ink);border-radius:12px;display:inline-grid;place-items:center;font:700 30px/1 'Mali'}
  .clue{display:block;text-align:left;max-width:640px;margin:10px auto 0;background:#FFF8E1;border:2px solid var(--sun);border-radius:14px;padding:10px 14px;font-size:18px;font-weight:400}
</style>
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
/* ป.4 วิทยาการคำนวณ ว14101 · สัปดาห์ที่ 1 การแก้ปัญหาโดยใช้เหตุผลเชิงตรรกะ — ไม่เก็บข้อมูลผู้เล่น */
(function () {
  const ROUNDS = [
    { q: 'ถ้าฝนตก สนามจะเปียก<br>วันนี้สนาม <b>ไม่เปียก</b> สรุปได้ว่าอย่างไร?', choices: ['วันนี้ฝนไม่ตก', 'วันนี้ฝนตกหนัก', 'เมื่อวานฝนตก', 'สนามแห้งเพราะลมแรง'], answer: 0, explain: 'ถ้าฝนตก สนามต้องเปียก แต่สนามไม่เปียก แปลว่าฝนไม่ได้ตก', short: 'ฝนตก → สนามเปียก' },
    { q: 'รูปถัดไปคืออะไร?<br><span class="seq">🔺🟦🔺🟦🔺<span class="q">?</span></span>', choices: ['🟦', '🔺', '🟢', '⭐'], answer: 0, explain: 'แบบรูปสลับ สามเหลี่ยม-สี่เหลี่ยม ซ้ำไปเรื่อย ๆ ต่อจากสามเหลี่ยมจึงเป็นสี่เหลี่ยม', short: 'แบบรูปสลับ 🔺🟦' },
    { q: 'จำนวนถัดไปคืออะไร?<br><span class="seq">3 6 9 12 <span class="q">?</span></span>', choices: ['15', '13', '14', '18'], answer: 0, explain: 'เพิ่มขึ้นทีละ 3 เสมอ 12 + 3 = 15', short: 'เพิ่มทีละ 3' },
    { q: 'กล่องแดง <b>หนักกว่า</b> กล่องฟ้า<br>กล่องฟ้า <b>หนักกว่า</b> กล่องเขียว<br>กล่องไหน <b>เบาที่สุด</b>?', choices: ['กล่องเขียว', 'กล่องแดง', 'กล่องฟ้า', 'หนักเท่ากัน'], answer: 0, explain: 'เรียงจากหนักไปเบา: แดง > ฟ้า > เขียว กล่องเขียวจึงเบาที่สุด', short: 'เปรียบเทียบน้ำหนัก' },
    { q: 'สัตว์ 3 ตัวนั่งเรียงแถว 🐱 🐶 🐰 (ไม่รู้ลำดับ)<span class="clue">• แมวนั่ง <b>ซ้ายสุด</b><br>• กระต่าย <b>ไม่ได้นั่งติด</b> แมว</span>ใครนั่งตรงกลาง?', choices: ['🐶 หมา', '🐱 แมว', '🐰 กระต่าย', 'บอกไม่ได้'], answer: 0, explain: 'แมวอยู่ซ้ายสุด กระต่ายต้องไม่ติดแมว จึงอยู่ขวาสุด ตรงกลางจึงเป็นหมา', short: 'ลำดับที่นั่งสัตว์' },
    { q: 'นักเรียนทุกคนในชมรมนี้ <b>ชอบวาดรูป</b><br>เจ้าหมีน้อยอยู่ในชมรมนี้ สรุปได้ว่าอย่างไร?', choices: ['เจ้าหมีน้อยชอบวาดรูป', 'เจ้าหมีน้อยไม่ชอบวาดรูป', 'ทุกคนที่ชอบวาดรูปอยู่ชมรมนี้', 'สรุปไม่ได้เลย'], answer: 0, explain: 'ทุกคนในชมรมชอบวาดรูป และเจ้าหมีน้อยอยู่ในชมรม จึงชอบวาดรูปด้วย', short: 'ทุกคนในชมรมชอบวาดรูป' },
    { q: 'รหัสลับ: A = 1, B = 2, C = 3<br>คำว่า <b>CAB</b> เขียนเป็นรหัสได้อย่างไร?', choices: ['312', '123', '321', '213'], answer: 0, explain: 'C = 3, A = 1, B = 2 เรียงตามตัวอักษร ได้ 3-1-2', short: 'รหัส CAB' },
    { q: 'สิ่งใด <b>ไม่เข้าพวก</b>?<br><span class="seq">🐶 🐱 🐰 🚗</span>', choices: ['🚗 รถ', '🐶 หมา', '🐱 แมว', '🐰 กระต่าย'], answer: 0, explain: 'หมา แมว กระต่าย เป็นสัตว์ ส่วนรถเป็นยานพาหนะ', short: 'หาสิ่งที่ไม่เข้าพวก' },
    { q: 'ถ้ากดสวิตช์ 💡 แล้วหลอดไฟไม่ติด ควรตรวจอะไร <b>ก่อน</b>?', choices: ['ปลั๊กเสียบอยู่และมีไฟฟ้าไหม', 'ซื้อหลอดไฟใหม่ทันที', 'ทาสีสวิตช์ใหม่', 'ปิดประตูห้อง'], answer: 0, explain: 'แก้ปัญหาโดยใช้เหตุผล: ตรวจสาเหตุที่ง่ายและเป็นไปได้มากที่สุดก่อน เช่น ไฟฟ้าเข้าหรือไม่', short: 'ตรวจสาเหตุที่ง่ายก่อน' },
    { q: 'ลำดับถัดไปคืออะไร?<br><span class="seq">🍎🍎🍌🍎🍎🍌🍎🍎<span class="q">?</span></span>', choices: ['🍌', '🍎', '🍇', '🍊'], answer: 0, explain: 'ชุดที่ซ้ำคือ แอปเปิล แอปเปิล กล้วย หลังแอปเปิล 2 ลูกจึงเป็นกล้วย', short: 'แบบรูป 🍎🍎🍌' },
  ];
  KIT.init({
    title: 'ไขปริศนาด้วยเหตุผล', grade: 'ป.4', subject: 'วิทยาการคำนวณ ว14101', topic: 'การแก้ปัญหาโดยใช้เหตุผลเชิงตรรกะ',
    icon: '🧩🤔', color: '#FF6F91', soft: '#FFE0E8',
    howto: ['อ่านโจทย์ปริศนาให้ละเอียด', 'ใช้เหตุผลหาคำตอบ แล้วกดเลือก', 'ดูคำอธิบายหลังตอบทุกข้อ ทั้งหมด 8 ข้อ (สุ่มใหม่ทุกครั้ง)'],
    start: (st) => KIT.mcq(st, { rounds: ROUNDS, count: 8, lesson: '<b>เหตุผลเชิงตรรกะ</b> คือ การคิดอย่างมีเหตุผลจากข้อมูลหรือเงื่อนไขที่มี เพื่อหาคำตอบหรือแก้ปัญหา เช่น สังเกตแบบรูป เปรียบเทียบ และสรุปจากเงื่อนไข "ถ้า...แล้ว..."' }),
  });
})();
</script>
</body>
</html>
