<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ข่าวจริงหรือข่าวปลอม</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .post{display:block;max-width:600px;margin:0 auto 4px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 6px 18px rgba(31,42,85,.08);font-size:17px;font-weight:400}
  .post .who{display:flex;align-items:center;gap:8px;font-weight:500}
  .post .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c-soft);font-size:18px}
  .post .meta{font-size:13px;color:var(--ink2);font-weight:400}
  .post .body{margin:8px 0 4px;font-size:18px}
  .post .link{display:inline-block;font-size:14px;color:#2E61D6;background:#EEF3FF;border-radius:8px;padding:2px 8px}
  .ask{display:block;margin-top:12px}
</style>
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
/* ป.4 คอมพิวเตอร์ ว14201 · สัปดาห์ที่ 8 การประเมินความน่าเชื่อถือของข้อมูล — ไม่เก็บข้อมูลผู้เล่น
   ข่าวและบัญชีทั้งหมดแต่งขึ้นเพื่อการเรียนรู้ */
(function () {
  const post = (av, who, meta, body, link) => `<span class="post"><span class="who"><span class="av">${av}</span><span>${who}<br><span class="meta">${meta}</span></span></span><span class="body" style="display:block">${body}</span>${link ? `<span class="link">🔗 ${link}</span>` : ''}</span><span class="ask">ข่าวนี้น่าเชื่อถือไหม?</span>`;
  const YN = ['✅ น่าเชื่อถือ', '❌ ไม่น่าเชื่อถือ'];
  const ROUNDS = [
    { q: post('❓', 'คนรักสุขภาพ 99', 'ไม่ระบุวันที่', 'ด่วน!!! กินกล้วยวันละ 10 ลูก หายป่วยทุกโรคใน 3 วัน แชร์ด่วนก่อนถูกลบ!!!'), choices: YN, answer: 1, keepOrder: true, explain: 'ไม่บอกแหล่งที่มา ใช้คำเกินจริง ("หายทุกโรค") และเร่งให้แชร์ เป็นลักษณะของข่าวปลอม', short: 'กินกล้วยหายทุกโรค' },
    { q: post('🌦️', 'กรมอุตุนิยมวิทยา (เพจทางการ)', 'วันนี้ 06:00 น.', 'พยากรณ์อากาศ: พรุ่งนี้ภาคตะวันออกเฉียงเหนือมีฝนฟ้าคะนอง ร้อยละ 60 ของพื้นที่', 'tmd.go.th'), choices: YN, answer: 0, keepOrder: true, explain: 'มาจากหน่วยงานที่รับผิดชอบโดยตรง เว็บไซต์ลงท้าย .go.th และมีวันเวลาที่เป็นปัจจุบัน', short: 'พยากรณ์อากาศจากกรมอุตุฯ' },
    { q: post('🎁', 'แจกฟรีทั่วไทย', 'เมื่อ 2 ชั่วโมงที่แล้ว', 'แจกแท็บเล็ตฟรีให้นักเรียนทุกคน! แค่กรอกชื่อ ที่อยู่ และเลขบัตรประชาชนที่ลิงก์นี้', 'bit.ly/free-tab-123'), choices: YN, answer: 1, keepOrder: true, explain: 'ขอข้อมูลส่วนตัวผ่านลิงก์ย่อที่ไม่รู้ที่มา เป็นการหลอกเอาข้อมูล ห้ามกรอกเด็ดขาด', short: 'แจกแท็บเล็ตฟรี ขอข้อมูลส่วนตัว' },
    { q: post('📰', 'เพจข่าวทันใจ', 'แชร์วันนี้ (ข่าวต้นฉบับเมื่อ 5 ปีก่อน)', 'น้ำท่วมใหญ่ในตัวเมือง! (ภาพเหตุการณ์เมื่อ 5 ปีที่แล้ว นำมาโพสต์ใหม่ว่าเพิ่งเกิด)'), choices: YN, answer: 1, keepOrder: true, explain: 'เป็นข่าวเก่าที่นำมาโพสต์ใหม่ ต้องดูวันที่ของข่าวต้นฉบับเสมอ', short: 'ข่าวเก่าโพสต์ใหม่' },
    { q: post('📚', 'ห้องสมุดประชาชนจังหวัด (เพจทางการ)', 'โพสต์เมื่อวานนี้', 'ห้องสมุดเปิดให้บริการวันเสาร์ 09:00–16:00 น. สอบถามได้ที่เบอร์ของห้องสมุด'), choices: YN, answer: 0, keepOrder: true, explain: 'มาจากเพจทางการของหน่วยงานเอง ระบุวันเวลาและช่องทางติดต่อชัดเจน', short: 'ประกาศของห้องสมุด' },
    { q: post('🐋', 'ไวรัลแรงมาก', 'ไม่ระบุที่มา', 'เจอปลาวาฬยักษ์ว่ายในแม่น้ำโขง! (ภาพดูแปลก ขอบภาพไม่เรียบ ไม่มีสำนักข่าวใดรายงาน)'), choices: YN, answer: 1, keepOrder: true, explain: 'ภาพน่าจะถูกตัดต่อ ไม่มีแหล่งข่าวอื่นยืนยัน และไม่บอกที่มา', short: 'ปลาวาฬในแม่น้ำโขง' },
    { q: post('🎓', 'เว็บไซต์คณะวิทยาศาสตร์ มหาวิทยาลัย', 'เผยแพร่เดือนนี้ · มีชื่อผู้เขียน', 'บทความ: ประโยชน์ของการนอนหลับให้เพียงพอต่อการเรียนรู้ของเด็ก พร้อมอ้างอิงงานวิจัย', 'sci.example.ac.th'), choices: YN, answer: 0, keepOrder: true, explain: 'มาจากสถาบันการศึกษา (.ac.th) มีชื่อผู้เขียน วันที่ และอ้างอิง จึงน่าเชื่อถือ', short: 'บทความจากมหาวิทยาลัย' },
    { q: post('💊', 'หมอดังบอกต่อ', 'ไม่บอกชื่อหมอ', 'หมอบอกว่ายานี้ดีที่สุด! สั่งซื้อวันนี้ลดราคา 90% เหลือ 10 กล่องสุดท้าย'), choices: YN, answer: 1, keepOrder: true, explain: 'อ้างว่าเป็นหมอแต่ไม่บอกชื่อ และมีเป้าหมายเพื่อขายของ ใช้คำเร่งให้รีบซื้อ', short: 'หมอดังบอกต่อ ขายยา' },
    { q: 'ก่อนจะ <b>แชร์</b> ข่าว ควรทำอย่างไร <b>ก่อน</b>?', choices: ['ดูแหล่งที่มา วันที่ และค้นเทียบจากหลายแหล่ง', 'แชร์ทันที เพราะเพื่อนแชร์มา', 'ดูแค่ว่ามีคนกดถูกใจเยอะไหม', 'เชื่อเพราะมีรูปประกอบ'], answer: 0, explain: 'ข้อมูลที่น่าเชื่อถือต้องรู้ว่ามาจากใคร เมื่อไร และมีแหล่งอื่นยืนยันตรงกัน', short: 'วิธีตรวจข่าวก่อนแชร์', oneCol: true },
    { q: 'เว็บไซต์ข้อใด <b>น่าเชื่อถือที่สุด</b> สำหรับทำรายงานเรื่องสุขภาพ?', choices: ['เว็บไซต์กระทรวงสาธารณสุข (.go.th)', 'โพสต์ขายอาหารเสริม', 'คอมเมนต์ใต้คลิปวิดีโอ', 'ข้อความส่งต่อในกลุ่มแชต'], answer: 0, explain: 'หน่วยงานที่รับผิดชอบเรื่องนั้นโดยตรง เช่น หน่วยงานรัฐ เป็นแหล่งข้อมูลที่น่าเชื่อถือ', short: 'เลือกแหล่งข้อมูลทำรายงาน', oneCol: true },
  ];
  KIT.init({
    title: 'ข่าวจริงหรือข่าวปลอม', grade: 'ป.4', subject: 'คอมพิวเตอร์ ว14201', topic: 'การประเมินความน่าเชื่อถือของข้อมูล',
    icon: '📰🔍', color: '#5B8CFF', soft: '#DFE8FF',
    howto: ['อ่านโพสต์ข่าว ดูว่าใครโพสต์ โพสต์เมื่อไร และลิงก์มาจากไหน', 'ตัดสินว่า น่าเชื่อถือ หรือ ไม่น่าเชื่อถือ', 'อ่านเหตุผลหลังตอบ ทั้งหมด 8 ข้อ (ข่าวทั้งหมดแต่งขึ้นเพื่อฝึก)'],
    start: (st) => KIT.mcq(st, { rounds: ROUNDS, count: 8, oneCol: false, lesson: 'ตรวจความน่าเชื่อถือด้วย 4 คำถาม: <b>ใคร</b>เป็นผู้เผยแพร่ · เผยแพร่<b>เมื่อไร</b> · มี<b>หลักฐาน</b>หรือแหล่งอ้างอิงไหม · มี<b>แหล่งอื่น</b>ยืนยันตรงกันไหม ระวังคำเกินจริง การเร่งให้แชร์ และการขอข้อมูลส่วนตัว' }),
  });
})();
</script>
</body>
</html>
