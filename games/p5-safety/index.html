<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รู้ทันภัยออนไลน์</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .msg{display:block;max-width:560px;margin:0 auto;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-size:17px;font-weight:400;box-shadow:0 6px 18px rgba(31,42,85,.08)}
  .msg .from{font-weight:500;display:block;margin-bottom:4px}
  .msg .bubble{display:inline-block;background:#EEF3FF;border-radius:14px 14px 14px 4px;padding:8px 12px}
  .ask{display:block;margin-top:12px}
</style>
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
/* ป.5 คอมพิวเตอร์ ว15201 · สัปดาห์ที่ 12–13 มารยาทในการติดต่อสื่อสาร / อาชญากรรมทางอินเทอร์เน็ต — ไม่เก็บข้อมูลผู้เล่น
   สถานการณ์ทั้งหมดแต่งขึ้นเพื่อการเรียนรู้ */
(function () {
  const msg = (from, text, q) => `<span class="msg"><span class="from">${from}</span><span class="bubble">${text}</span></span><span class="ask">${q || 'ควรทำอย่างไร?'}</span>`;
  const ROUNDS = [
    { q: msg('📩 SMS จากเบอร์แปลก', 'ยินดีด้วย! คุณได้รับรางวัลโทรศัพท์มือถือ กดลิงก์ bit.ly/xxxx เพื่อรับรางวัลภายใน 10 นาที'), choices: ['ไม่กดลิงก์ ลบข้อความ แล้วบอกผู้ปกครอง', 'รีบกดลิงก์ก่อนหมดเวลา', 'ส่งต่อให้เพื่อนทุกคน', 'ตอบกลับไปถามรายละเอียด'], answer: 0, explain: 'ข้อความแจ้งว่าได้รางวัลโดยไม่ได้สมัครและเร่งให้รีบกด เป็นกลลวง (ฟิชชิง) เพื่อขโมยข้อมูล', short: 'SMS แจ้งได้รางวัล' },
    { q: msg('🎮 คนแปลกหน้าในเกมออนไลน์', 'เล่นเก่งจัง บ้านอยู่ที่ไหน เรียนโรงเรียนอะไร ขอเบอร์โทรหน่อยสิ'), choices: ['ไม่บอกข้อมูลส่วนตัว บล็อก และบอกครูหรือผู้ปกครอง', 'บอกแค่ชื่อโรงเรียน', 'บอกเบอร์โทรเพราะเป็นเพื่อนในเกม', 'นัดเจอกันหลังเลิกเรียน'], answer: 0, explain: 'ชื่อ ที่อยู่ โรงเรียน เบอร์โทร เป็นข้อมูลส่วนตัว ห้ามบอกคนแปลกหน้าในโลกออนไลน์', short: 'คนแปลกหน้าขอข้อมูลส่วนตัว' },
    { q: msg('👫 เพื่อนในห้อง', 'ขอรหัสผ่านเกมหน่อย เดี๋ยวช่วยเล่นเก็บเลเวลให้'), choices: ['ไม่ให้รหัสผ่าน แม้จะเป็นเพื่อนสนิท', 'ให้ได้เพราะเป็นเพื่อน', 'ให้แล้วค่อยเปลี่ยนทีหลัง', 'เขียนรหัสผ่านติดไว้ที่โต๊ะ'], answer: 0, explain: 'รหัสผ่านเป็นความลับเฉพาะตัว ไม่ควรบอกใคร ยกเว้นผู้ปกครอง', short: 'เพื่อนขอรหัสผ่าน' },
    { q: msg('💬 ข้อความในกลุ่มแชต', 'มีคนโพสต์ล้อเลียนเพื่อนในห้องด้วยคำหยาบ และชวนให้ทุกคนเข้ามาด่าต่อ'), choices: ['ไม่ร่วมล้อเลียน เก็บหลักฐาน และบอกครู', 'พิมพ์ด่าตามคนอื่น', 'กดหัวเราะแล้วแชร์ต่อ', 'เงียบไว้และลบแชตทิ้ง'], answer: 0, explain: 'นี่คือการกลั่นแกล้งทางออนไลน์ (ไซเบอร์บูลลี่) ไม่ควรร่วมทำ ควรเก็บหลักฐานแล้วแจ้งผู้ใหญ่ที่ไว้ใจ', short: 'การกลั่นแกล้งในกลุ่มแชต' },
    { q: msg('⚠️ หน้าต่างเด้งขึ้นมา', 'เครื่องของคุณติดไวรัส 5 ตัว! กดปุ่มนี้เพื่อดาวน์โหลดโปรแกรมกำจัดไวรัสทันที'), choices: ['ไม่กด ปิดหน้าต่าง แล้วบอกครูหรือผู้ปกครอง', 'กดดาวน์โหลดทันที', 'กรอกเบอร์โทรเพื่อรับโปรแกรม', 'กดตกลงทุกปุ่มที่ขึ้นมา'], answer: 0, explain: 'หน้าต่างหลอกให้ตกใจเพื่อให้ดาวน์โหลดโปรแกรมอันตราย ควรปิดและให้ผู้ใหญ่ช่วยตรวจ', short: 'หน้าต่างเตือนไวรัสปลอม' },
    { q: msg('🛒 โพสต์ขายของในเกม', 'ขายไอเท็มหายาก ราคาถูกมาก! โอนเงินก่อน แล้วส่งรหัสบัญชีมาให้ด้วย'), choices: ['ไม่ซื้อ ไม่โอน และไม่ให้รหัสบัญชี', 'รีบโอนก่อนคนอื่นแย่ง', 'ให้รหัสบัญชีไปเพื่อรับของ', 'ยืมเงินพ่อแม่มาซื้อโดยไม่บอก'], answer: 0, explain: 'ราคาถูกเกินจริงและขอรหัสบัญชี เป็นลักษณะของการหลอกลวงซื้อขายออนไลน์', short: 'ขายไอเท็มในเกมราคาถูก' },
    { q: msg('🔒 บัญชีของฉัน', 'มีคนเข้าบัญชีเกมของฉันจากเครื่องอื่น และเปลี่ยนรูปโปรไฟล์ไปแล้ว'), choices: ['บอกผู้ปกครองให้ช่วยเปลี่ยนรหัสผ่านและแจ้งผู้ให้บริการ', 'ปล่อยไว้ เดี๋ยวก็หายเอง', 'สมัครบัญชีใหม่แล้วใช้รหัสเดิม', 'โพสต์ด่าคนที่แฮกลงกลุ่ม'], answer: 0, explain: 'บัญชีถูกเจาะ ต้องรีบเปลี่ยนรหัสผ่านใหม่ที่เดายาก และแจ้งผู้ให้บริการโดยมีผู้ใหญ่ช่วย', short: 'บัญชีถูกแฮก' },
    { q: 'รหัสผ่านข้อใด <b>ปลอดภัยที่สุด</b>?', choices: ['Nk#7pRiver!29', '123456', 'password', 'วันเกิดของตัวเอง'], answer: 0, explain: 'รหัสผ่านที่ดีควรยาว มีตัวพิมพ์เล็ก-ใหญ่ ตัวเลข และสัญลักษณ์ และไม่ใช่ข้อมูลที่เดาได้ง่าย', short: 'รหัสผ่านที่ปลอดภัย' },
    { q: msg('📷 คนแปลกหน้าทางแชต', 'ส่งรูปตัวเองมาให้ดูหน่อย แล้วอย่าบอกพ่อแม่นะ เป็นความลับของเรา'), choices: ['ไม่ส่งรูป บล็อก และบอกผู้ปกครองหรือครูทันที', 'ส่งรูปให้เพราะเขาพูดดี', 'เก็บเป็นความลับตามที่เขาขอ', 'ส่งรูปเพื่อนไปแทน'], answer: 0, explain: 'ผู้ใหญ่ที่ดีจะไม่ขอให้เด็กเก็บความลับจากพ่อแม่ ถ้ามีใครขอแบบนี้ ต้องบอกผู้ใหญ่ที่ไว้ใจทันที ไม่ใช่ความผิดของเรา', short: 'คนแปลกหน้าขอรูปและให้เก็บความลับ' },
    { q: 'ข้อใดเป็น <b>มารยาทที่ดี</b> ในการส่งข้อความออนไลน์?', choices: ['ใช้คำสุภาพ และไม่โพสต์รูปเพื่อนโดยไม่ขออนุญาต', 'พิมพ์ตัวใหญ่ทั้งหมดเพื่อให้คนสนใจ', 'ส่งข้อความรัว ๆ จนกว่าจะตอบ', 'แชร์ข้อมูลส่วนตัวของเพื่อน'], answer: 0, explain: 'ปฏิบัติต่อคนอื่นในโลกออนไลน์อย่างที่อยากให้เขาปฏิบัติต่อเรา ใช้คำสุภาพและเคารพความเป็นส่วนตัว', short: 'มารยาทในการสื่อสาร' },
  ];
  KIT.init({
    title: 'รู้ทันภัยออนไลน์', grade: 'ป.5', subject: 'คอมพิวเตอร์ ว15201', topic: 'อาชญากรรมทางอินเทอร์เน็ต / มารยาทในการติดต่อสื่อสาร',
    icon: '🛡️📱', color: '#1FB5B0', soft: '#D5F4F2',
    howto: ['อ่านสถานการณ์ที่อาจเจอบนอินเทอร์เน็ต', 'เลือกวิธีรับมือที่ปลอดภัยที่สุด', 'ทั้งหมด 8 ข้อ (สถานการณ์แต่งขึ้นเพื่อฝึก)'],
    start: (st) => KIT.mcq(st, { rounds: ROUNDS, count: 8, oneCol: true, lesson: 'จำไว้ 3 ข้อ: <b>หยุด</b> — ไม่กดลิงก์หรือโอนเงินเมื่อถูกเร่ง · <b>ไม่บอก</b> — ข้อมูลส่วนตัวและรหัสผ่าน · <b>บอกผู้ใหญ่</b> — เมื่อเจอสิ่งที่ไม่สบายใจ ครูและผู้ปกครองพร้อมช่วยเสมอ' }),
  });
})();
</script>
</body>
</html>
