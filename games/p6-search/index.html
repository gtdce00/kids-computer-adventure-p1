<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>นักค้นหามือโปร</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .sbox{display:inline-flex;align-items:center;gap:8px;max-width:100%;background:#fff;border:2px solid #C9D3EE;border-radius:999px;padding:8px 16px;font:400 18px/1.3 'Mitr';box-shadow:0 4px 12px rgba(31,42,85,.08)}
  .kw{font-family:Consolas,'Courier New',monospace;background:#F1F4FF;border-radius:6px;padding:1px 6px;white-space:nowrap}
  .res{display:block;max-width:600px;margin:10px auto 0;text-align:left;font-size:16px;font-weight:400}
  .res span{display:block;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:6px}
  .res small{color:#1A7F37}
</style>
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
/* ป.6 วิทยาการคำนวณ ว16101 · สัปดาห์ที่ 3–4 การค้นหาข้อมูลและการกำหนดขอบเขตการค้นหา — ไม่เก็บข้อมูลผู้เล่น */
(function () {
  const k = (t) => `<span class="kw">${t}</span>`;
  const ROUNDS = [
    { q: 'อยากรู้ "วิธีปลูกผักบุ้งในกระถาง"<br>ควรพิมพ์คำค้นแบบไหน?', choices: [k('วิธีปลูกผักบุ้ง กระถาง'), k('ผัก'), k('อยากรู้ว่าผักบุ้งปลูกยังไงในกระถางที่บ้านครับ'), k('บุ้ง')], answer: 0, explain: 'ใช้<b>คำสำคัญ</b>ที่ตรงกับเรื่อง สั้น กระชับ ไม่กว้างเกินไป (ผัก) และไม่ยาวเป็นประโยคพูด', short: 'เลือกคำสำคัญ' },
    { q: 'อยากได้ผลลัพธ์ที่มีวลี <b>เครื่องสังคโลก สุโขทัย</b> ติดกันตรงตัว ควรพิมพ์แบบไหน?', choices: [k('"เครื่องสังคโลก สุโขทัย"'), k('เครื่องสังคโลก -สุโขทัย'), k('site:สุโขทัย'), k('เครื่อง สังคโลก')], answer: 0, explain: 'ใส่<b>เครื่องหมายคำพูด " "</b> ครอบวลี เพื่อค้นหาคำที่เรียงติดกันตรงตัว', short: 'ใช้ " " ค้นวลีตรงตัว' },
    { q: 'ค้นหาเรื่อง <b>เสือ (สัตว์)</b> แต่ผลลัพธ์มีแต่ทีมฟุตบอล ควรพิมพ์แบบไหน?', choices: [k('เสือ -ฟุตบอล'), k('เสือ ฟุตบอล'), k('"ฟุตบอล"'), k('เสือ+ฟุตบอล+ทีม')], answer: 0, explain: 'ใช้<b>เครื่องหมายลบ (-)</b> หน้าคำที่ไม่ต้องการ เพื่อตัดผลลัพธ์ที่เกี่ยวกับคำนั้นออก', short: 'ใช้ - ตัดคำที่ไม่ต้องการ' },
    { q: 'อยากค้นข้อมูลจาก<b>เว็บไซต์หน่วยงานรัฐ</b>เท่านั้น ควรเติมอะไรในคำค้น?', choices: [k('site:go.th'), k('filetype:pdf'), k('"รัฐบาล"'), k('-go.th')], answer: 0, explain: '<b>site:</b> ใช้จำกัดผลลัพธ์ให้มาจากเว็บไซต์หรือโดเมนที่กำหนด เช่น go.th คือหน่วยงานรัฐไทย', short: 'ใช้ site: จำกัดเว็บไซต์' },
    { q: 'ครูให้หา<b>ใบงานที่เป็นไฟล์ PDF</b> เรื่องพลังงาน ควรพิมพ์แบบไหน?', choices: [k('ใบงาน พลังงาน filetype:pdf'), k('ใบงาน พลังงาน site:pdf'), k('"PDF"'), k('ใบงาน -pdf')], answer: 0, explain: '<b>filetype:</b> ใช้ค้นหาเฉพาะชนิดไฟล์ที่ต้องการ เช่น pdf, docx, pptx', short: 'ใช้ filetype: ค้นชนิดไฟล์' },
    { q: 'อยากได้<b>ข่าวล่าสุด</b> เรื่องฝุ่น PM2.5 ไม่เอาข่าวเก่าหลายปีก่อน ควรทำอย่างไร?', choices: ['ใช้ตัวกรอง "เครื่องมือ" เลือกช่วงเวลา เช่น สัปดาห์ที่ผ่านมา', 'เลื่อนดูผลลัพธ์ไปเรื่อย ๆ จนกว่าจะเจอ', 'พิมพ์คำค้นซ้ำหลายรอบ', 'เลือกผลลัพธ์อันแรกเสมอ'], answer: 0, explain: 'การ<b>กำหนดขอบเขตเวลา</b>ด้วยตัวกรอง ช่วยให้ได้ข้อมูลที่เป็นปัจจุบัน', short: 'กรองช่วงเวลา' },
    { q: `ทำรายงานเรื่องการล้างมือ ผลการค้นหามี 3 รายการ ควรเลือกอันไหนเป็นแหล่งข้อมูลหลัก?<span class="res"><span>① <b>วิธีล้างมือ 7 ขั้นตอน</b><br><small>www.example.moph.go.th › ...</small></span><span>② <b>โฆษณา · เจลล้างมือลด 70%</b><br><small>shop-example.com</small></span><span>③ <b>ใครล้างมือบ่อยบ้าง มาคุยกัน</b><br><small>กระทู้เว็บบอร์ด</small></span></span>`, choices: ['① เว็บไซต์หน่วยงานสาธารณสุข', '② โฆษณาขายเจลล้างมือ', '③ กระทู้พูดคุย', 'เลือกอันไหนก็ได้'], answer: 0, explain: 'เลือกแหล่งข้อมูลจากหน่วยงานที่รับผิดชอบเรื่องนั้นโดยตรง ระวังผลลัพธ์ที่เป็น<b>โฆษณา</b>และความคิดเห็นส่วนตัว', short: 'เลือกผลการค้นหาที่น่าเชื่อถือ', oneCol: true },
    { q: 'ค้นคำว่า <b>วิธีเลี้ยงปลากัด</b> แล้วผลลัพธ์น้อยมาก ควรทำอย่างไร?', choices: ['ลองใช้คำที่มีความหมายใกล้เคียง เช่น "การดูแลปลากัด"', 'เลิกค้นหา', 'เพิ่มเครื่องหมาย - หลายตัว', 'พิมพ์คำเดิมให้ยาวขึ้นเป็นประโยค'], answer: 0, explain: 'ถ้าผลลัพธ์ไม่ตรงหรือน้อย ให้<b>เปลี่ยนคำค้น</b> ใช้คำพ้องความหมายหรือคำที่เกี่ยวข้อง', short: 'เปลี่ยนคำค้น' },
    { q: 'คำค้นใด <b>แคบที่สุด</b> และตรงกับ "อาหารประจำภาคอีสานที่ทำจากข้าวเหนียว" มากที่สุด?', choices: [k('อาหารอีสาน ข้าวเหนียว'), k('อาหาร'), k('อาหารไทย'), k('ข้าว')], answer: 0, explain: 'ยิ่งใส่คำสำคัญที่เจาะจงมาก ขอบเขตการค้นหายิ่งแคบ ได้ผลลัพธ์ตรงขึ้น', short: 'กำหนดขอบเขตให้แคบ' },
    { q: `ผลของคำค้น ${k('ดาวเคราะห์ site:ac.th')} คืออะไร?`, choices: ['หาเรื่องดาวเคราะห์จากเว็บไซต์สถาบันการศึกษาเท่านั้น', 'หาเว็บที่ไม่มีคำว่าดาวเคราะห์', 'หาเฉพาะไฟล์ PDF', 'หาข่าวล่าสุดเท่านั้น'], answer: 0, explain: 'ac.th คือโดเมนของสถาบันการศึกษาในไทย site: จึงจำกัดผลลัพธ์ให้มาจากเว็บไซต์กลุ่มนี้', short: 'อ่านความหมาย site:ac.th', oneCol: true },
  ];
  KIT.init({
    title: 'นักค้นหามือโปร', grade: 'ป.6', subject: 'วิทยาการคำนวณ ว16101', topic: 'การค้นหาข้อมูลและการกำหนดขอบเขตการค้นหา',
    icon: '🔎🌐', color: '#4C97FF', soft: '#DEEBFF',
    howto: ['อ่านสิ่งที่อยากค้นหา', 'เลือกคำค้นหรือวิธีค้นที่ได้ผลลัพธ์ตรงที่สุด', 'ทั้งหมด 8 ข้อ ฝึกใช้ " ", -, site:, filetype: และตัวกรองเวลา'],
    start: (st) => KIT.mcq(st, { rounds: ROUNDS, count: 8, lesson: 'ค้นหาให้ตรงด้วย <b>คำสำคัญ</b> ที่เจาะจง · <span class="kw">" "</span> ค้นวลีตรงตัว · <span class="kw">-คำ</span> ตัดคำที่ไม่ต้องการ · <span class="kw">site:</span> จำกัดเว็บไซต์ · <span class="kw">filetype:</span> จำกัดชนิดไฟล์ · ตัวกรองเวลาเพื่อข้อมูลล่าสุด และเลือกแหล่งที่น่าเชื่อถือ' }),
  });
})();
</script>
</body>
</html>
